services:
  - type: web
    name: mitracare-api-shashank-k8r3
    runtime: python
    plan: free
    region: singapore
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m app.seed_demo && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mitracare-db-shashank-k8r3
          property: connectionString
      - key: COOKIE_SECURE
        value: "true"
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: mitracare-db-shashank-k8r3
    databaseName: mitracare
    user: mitracare_user
    plan: free
    region: singapore
