[build]
  command = "mkdir -p dist/static && cp static/index.html dist/index.html && cp static/app.js static/styles.css dist/static/ && cp static/_headers dist/_headers"
  publish = "dist"

# Proxy API requests through the Netlify origin. This preserves the app's
# same-origin fetch + HttpOnly session-cookie behavior.
[[redirects]]
  from = "/api/*"
  to = "https://mitracare-api-shashank-k8r3.onrender.com/api/:splat"
  status = 200
  force = true
